<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#0b0b0f"/>
<title>XANIMEHUB — JIYYAD TOOLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0b0b0f;--bg2:#121218;--card:#18181f;--line:#2a2a33;
  --text:#f5f5f7;--muted:#9a9aa3;--faint:#5c5c66;
  --orange:#f47521;--orange2:#ff8a3d;
  --font:Inter,system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--ease2:cubic-bezier(.16,1,.3,1);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes introPop{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes introUp{to{opacity:1;transform:translateY(0)}}
@keyframes introLine{to{width:100px}}

.intro{position:fixed;inset:0;z-index:300;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .7s var(--ease2),visibility .7s}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-inner{text-align:center;padding:24px}
.intro-logo{width:min(280px,80vw);margin:0 auto 16px;opacity:0;transform:scale(.88) translateY(12px);animation:introPop .85s var(--ease2) .15s forwards}
.intro-logo img{width:100%;height:auto;display:block}
.intro-brand{font-size:20px;font-weight:800;letter-spacing:-.4px;opacity:0;animation:introUp .65s var(--ease2) .45s forwards}
.intro-brand span{color:var(--orange)}
.intro-tag{margin-top:6px;font-size:12.5px;color:var(--muted);opacity:0;animation:introUp .6s var(--ease2) .6s forwards}
.intro-line{width:0;height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--orange),transparent);animation:introLine .9s var(--ease2) .8s forwards}
.intro-dots{margin-top:22px;display:flex;gap:6px;justify-content:center;opacity:0;animation:introUp .5s var(--ease2) 1s forwards}
.intro-dots i{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulse 1s ease infinite}
.intro-dots i:nth-child(2){animation-delay:.15s}
.intro-dots i:nth-child(3){animation-delay:.3s}

.app{opacity:0;transition:opacity .55s var(--ease2);height:100%;display:flex;flex-direction:column}
.app.show{opacity:1}

.top{
  flex-shrink:0;display:flex;align-items:center;gap:12px;
  padding:max(10px,env(safe-area-inset-top)) 14px 10px;
  background:rgba(11,11,15,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{
  width:36px;height:36px;border-radius:9px;
  background:#111;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;padding:3px;
}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.4px;line-height:1.05}
.brand p{font-size:9px;color:var(--faint);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.top-search{flex:1;min-width:0}
.top-search input{
  width:100%;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);padding:0 12px;font-size:13px;font-family:var(--font);outline:none;
}
.top-search input:focus{border-color:var(--orange)}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.icon-btn svg{width:18px;height:18px}

.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(78px + var(--safe-b));display:none}
.page.on{display:block;animation:fadeIn .3s var(--ease)}

.hero-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.hero-row h2{font-size:22px;font-weight:800;letter-spacing:-.5px}
.hero-row span{font-size:12px;color:var(--muted)}

.section{margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between}
.section h3{font-size:15px;font-weight:750}
.section span{font-size:11px;color:var(--faint)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:780px){.grid{grid-template-columns:repeat(4,1fr)}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;
  transition:transform .22s var(--ease),border-color .22s,box-shadow .3s;
  animation:fadeUp .4s var(--ease) both;
}
.card:active{transform:scale(.97)}
.card:hover{border-color:#3a3a45;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.poster{position:relative;aspect-ratio:2/3;background:#1a1a22;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s var(--ease)}
.card:hover .poster img{transform:scale(1.05)}
.badge{
  position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;
  background:rgba(0,0,0,.75);color:#fff;padding:3px 7px;border-radius:6px;backdrop-filter:blur(6px);
}
.badge.sub{background:var(--orange);color:#fff}
.card-body{padding:9px 10px 11px}
.card-title{font-size:12.5px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:11px;color:var(--faint);margin-top:4px}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;margin-bottom:12px}
.back svg{width:16px;height:16px}
.detail-hero{display:flex;gap:14px;margin-bottom:14px}
.detail-poster{width:120px;flex-shrink:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:2/3;background:var(--card)}
.detail-poster img{width:100%;height:100%;object-fit:cover}
.detail-info{flex:1;min-width:0}
.detail-info h2{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.2;margin-bottom:6px}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:100px;border:1px solid var(--line);color:var(--muted)}
.chip.orange{background:rgba(244,117,33,.15);border-color:rgba(244,117,33,.4);color:var(--orange)}
.synopsis{font-size:13px;color:var(--muted);line-height:1.55;margin:12px 0 16px}

.ep-list{display:flex;flex-direction:column;gap:8px}
.ep-item{
  display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);cursor:pointer;
  transition:border-color .2s,background .2s;
}
.ep-item:hover,.ep-item.on{border-color:var(--orange);background:#1c1714}
.ep-num{
  width:42px;height:42px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:750;font-size:13px;flex-shrink:0;
}
.ep-item.on .ep-num{background:var(--orange);border-color:var(--orange);color:#fff}
.ep-body{flex:1;min-width:0}
.ep-body h4{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-body p{font-size:11px;color:var(--faint);margin-top:2px}
.ep-play{color:var(--orange)}
.ep-play svg{width:20px;height:20px}

/* player */
.player-box{
  background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  margin-bottom:12px;aspect-ratio:16/9;position:relative;
}
.player-box iframe,.player-box video{width:100%;height:100%;border:0;display:block;background:#000}
.player-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:#121218;gap:10px}
.player-fallback h4{font-size:14px;font-weight:700}
.player-fallback p{font-size:12px;color:var(--muted);line-height:1.45;max-width:280px}
.player-fallback .fb-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.player-fallback a,.player-fallback button{
  display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--text);
  font-size:12.5px;font-weight:650;font-family:var(--font);text-decoration:none;cursor:pointer;
}
.player-fallback a.primary,.player-fallback button.primary{background:var(--orange);border-color:var(--orange);color:#fff}

.server-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.srv{
  padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font-size:12px;font-weight:650;font-family:var(--font);cursor:pointer;
}
.srv.on{background:var(--orange);border-color:var(--orange);color:#fff}
.dl-list{display:flex;flex-direction:column;gap:8px}
.dl-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  text-decoration:none;color:var(--text);font-size:13px;font-weight:600;
}
.dl-item:hover{border-color:var(--orange)}
.dl-item span{color:var(--muted);font-size:11px;font-weight:500}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  max-width:560px;margin:0 auto;
  padding:6px 12px calc(6px + var(--safe-b));
  background:rgba(11,11,15,.94);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:flex;
}
.tab{
  flex:1;height:50px;border:none;background:none;color:var(--faint);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;font-weight:650;font-family:var(--font);cursor:pointer;transition:color .2s;
}
.tab.on{color:var(--orange)}
.tab svg{width:20px;height:20px}

.empty{text-align:center;padding:40px 12px;color:var(--faint);font-size:13px}
.loader{display:flex;justify-content:center;padding:36px}
.spin{width:22px;height:22px;border:2px solid #333;border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite}
.toast{
  position:fixed;left:50%;bottom:calc(70px + var(--safe-b));transform:translateX(-50%) translateY(10px);
  background:var(--orange);color:#fff;padding:10px 16px;border-radius:100px;font-size:12.5px;font-weight:650;
  opacity:0;pointer-events:none;z-index:100;transition:opacity .25s,transform .3s var(--ease);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="intro" id="intro">
  <div class="intro-inner">
    <div class="intro-logo"><img src="logo-jiyyad.png" alt="JIYYAD TOOLS"/></div>
    <div class="intro-brand">XANIME<span>HUB</span></div>
    <div class="intro-tag">JIYYAD TOOLS · website kebutuhan anda</div>
    <div class="intro-line"></div>
    <div class="intro-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="brand-mark"><img src="logo-jiyyad.png" alt="JIYYAD TOOLS"/></div>
      <div>
        <h1>XANIMEHUB</h1>
        <p>Jiyyad Tools</p>
      </div>
    </div>
    <div class="top-search">
      <input id="q" type="search" placeholder="Cari anime…" autocomplete="off"/>
    </div>
    <button type="button" class="icon-btn" id="btn-search" title="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </header>

  <div class="pages">
    <div class="page on" id="page-home">
      <div class="hero-row">
        <h2>Home</h2>
        <span id="home-count">Loading…</span>
      </div>
      <div class="section"><h3>Latest Updates</h3><span>Samehadaku</span></div>
      <div class="grid" id="home-grid"><div class="loader" style="grid-column:1/-1"><div class="spin"></div></div></div>
    </div>

    <div class="page" id="page-search">
      <div class="hero-row"><h2>Search</h2><span id="search-count"></span></div>
      <div class="grid" id="search-grid"><div class="empty">Ketik judul anime lalu Enter / Search</div></div>
    </div>

    <div class="page" id="page-detail">
      <button type="button" class="back" id="back-detail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Kembali</button>
      <div id="detail-body"><div class="loader"><div class="spin"></div></div></div>
    </div>

    <div class="page" id="page-player">
      <button type="button" class="back" id="back-player"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Kembali</button>
      <div class="player-box" id="player-box"></div>
      <h2 id="p-title" style="font-size:16px;font-weight:750;margin-bottom:4px">—</h2>
      <p id="p-sub" style="font-size:12px;color:var(--muted);margin-bottom:12px">—</p>
      <div class="section"><h3>Server</h3></div>
      <div class="server-row" id="servers"></div>
      <div class="section"><h3>Download</h3></div>
      <div class="dl-list" id="downloads"><div class="empty">Tidak ada link download</div></div>
      <div class="section"><h3>Episodes</h3></div>
      <div class="ep-list" id="p-eps"></div>
    </div>
  </div>

  <nav class="tabbar">
    <button type="button" class="tab on" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>
      Home
    </button>
    <button type="button" class="tab" data-page="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Search
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let currentAnime = null;
let currentEp = null;
let lastPage = 'home';

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._);toast._=setTimeout(()=>t.classList.remove('on'),2000)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function api(body){
  const r = await fetch('/api/anime',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return r.json();
}

function showPage(id){
  $$('.page').forEach(p=>p.classList.remove('on'));
  $('#page-'+id)?.classList.add('on');
  if(id==='home'||id==='search'){
    $$('.tab').forEach(t=>t.classList.toggle('on', t.dataset.page===id));
    lastPage = id;
  } else {
    $$('.tab').forEach(t=>t.classList.remove('on'));
  }
  if(id!=='player'){
    const box=$('#player-box');
    if(box) box.innerHTML='';
  }
}

function isAnimeUrl(u){
  return /\/anime\//i.test(u||'');
}

function cardHTML(item,i){
  const title = item.title||'Untitled';
  const poster = item.poster||'';
  const url = item.url||item.href||'';
  const ep = item.episode||item.type||'';
  const sub = item.sub||'';
  return `<div class="card" data-url="${esc(url)}" data-title="${esc(title)}" style="animation-delay:${Math.min(i,15)*0.03}s">
    <div class="poster">
      <img src="${esc(poster)}" alt="" loading="lazy" onerror="this.style.opacity=.25"/>
      ${sub?`<span class="badge sub">${esc(sub)}</span>`:''}
      ${ep&&!sub?`<span class="badge">${esc(ep)}</span>`:ep&&sub?`<span class="badge" style="left:auto;right:8px">${esc(ep)}</span>`:''}
    </div>
    <div class="card-body">
      <div class="card-title">${esc(title)}</div>
      <div class="card-meta">${esc(item.type||'Anime')}${ep?' · '+esc(ep):''}</div>
    </div>
  </div>`;
}

function bindCards(root){
  root.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>{
      const url=c.dataset.url;
      if(!url) return;
      if(isAnimeUrl(url)) openDetail(url);
      else openEpisode(url, c.dataset.title);
    };
  });
}

async function loadHome(){
  const grid=$('#home-grid');
  grid.innerHTML='<div class="loader" style="grid-column:1/-1"><div class="spin"></div></div>';
  try{
    if(!location.protocol.startsWith('http')){
      grid.innerHTML='<div class="empty" style="grid-column:1/-1">Jalankan: npm start</div>';
      return;
    }
    const d=await api({action:'latest',page:'1'});
    const items=d?.result?.items||[];
    $('#home-count').textContent=items.length+' updates';
    if(!items.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Kosong</div>';return}
    grid.innerHTML=items.map((x,i)=>cardHTML(x,i)).join('');
    bindCards(grid);
  }catch{
    grid.innerHTML='<div class="empty" style="grid-column:1/-1">Gagal memuat</div>';
  }
}

async function doSearch(){
  const q=$('#q').value.trim();
  if(!q){toast('Masukkan judul');return}
  if(q.length<2){toast('Minimal 2 huruf');return}
  showPage('search');
  const grid=$('#search-grid');
  grid.innerHTML='<div class="loader" style="grid-column:1/-1"><div class="spin"></div></div>';
  try{
    const d=await api({action:'search',query:q,page:'1'});
    if(d?.status===false){
      grid.innerHTML=`<div class="empty" style="grid-column:1/-1">${esc(d.message||'Gagal')}</div>`;
      return;
    }
    const items=d?.result?.items||[];
    $('#search-count').textContent=items.length+' hasil';
    if(!items.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">Tidak ditemukan</div>';return}
    grid.innerHTML=items.map((x,i)=>cardHTML(x,i)).join('');
    bindCards(grid);
  }catch{
    grid.innerHTML='<div class="empty" style="grid-column:1/-1">Search error</div>';
  }
}

async function openDetail(url){
  showPage('detail');
  const body=$('#detail-body');
  body.innerHTML='<div class="loader"><div class="spin"></div></div>';
  try{
    const d=await api({action:'detail',url});
    if(!d?.status||!d.result){
      body.innerHTML=`<div class="empty">${esc(d?.message||'Detail gagal')}</div>`;
      return;
    }
    const r=d.result;
    currentAnime=r;
    currentAnime._url=url;
    const eps=r.episodes||[];
    const genres=(r.genres||[]).map(g=>typeof g==='string'?g:g.name).filter(Boolean);
    const info=r.info||{};
    body.innerHTML=`
      <div class="detail-hero">
        <div class="detail-poster"><img src="${esc(r.poster)}" alt="" onerror="this.style.opacity=.3"/></div>
        <div class="detail-info">
          <h2>${esc(r.title)}</h2>
          <div class="meta-row">
            ${r.rating?`<span class="chip orange">★ ${esc(r.rating)}</span>`:''}
            ${info.status?`<span class="chip">${esc(info.status)}</span>`:''}
            ${info.type?`<span class="chip">${esc(info.type)}</span>`:''}
            ${info.season?`<span class="chip">${esc(info.season)}</span>`:''}
          </div>
          <div class="meta-row">${genres.slice(0,6).map(g=>`<span class="chip">${esc(g)}</span>`).join('')}</div>
        </div>
      </div>
      <p class="synopsis">${esc(r.synopsis||r.description||'')}</p>
      <div class="section"><h3>Episodes</h3><span>${eps.length} eps</span></div>
      <div class="ep-list" id="detail-eps">
        ${eps.length?eps.slice().reverse().map(e=>{
          const eu=e.url||e.href;
          return `<div class="ep-item" data-url="${esc(eu)}">
            <div class="ep-num">${esc(e.episode||'?')}</div>
            <div class="ep-body"><h4>${esc(e.title||('Episode '+e.episode))}</h4><p>${esc(e.date||e.sub||'')}</p></div>
            <div class="ep-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
          </div>`;
        }).join(''):'<div class="empty">Belum ada episode</div>'}
      </div>`;
    body.querySelectorAll('.ep-item').forEach(el=>{
      el.onclick=()=>openEpisode(el.dataset.url, r.title);
    });
  }catch{
    body.innerHTML='<div class="empty">Gagal memuat detail</div>';
  }
}

function setPlayer(embedOrUrl, meta){
  const box=$('#player-box');
  meta = meta || {};
  if(!embedOrUrl){
    box.innerHTML='<div class="player-fallback"><h4>Stream tidak tersedia</h4><p>API tidak mengembalikan URL video untuk episode ini.</p></div>';
    return;
  }
  const isDirect=/\.(mp4|m3u8|webm)(\?|$)/i.test(embedOrUrl);
  if(isDirect){
    const src=/^https?:\/\//i.test(embedOrUrl)?'/api/proxy?url='+encodeURIComponent(embedOrUrl):embedOrUrl;
    box.innerHTML=`<video controls playsinline autoplay src="${esc(src)}"></video>`;
    return;
  }
  // embed iframe + fallback overlay helper
  const host = (()=>{ try{ return new URL(embedOrUrl).hostname }catch{ return '' }})();
  box.innerHTML = `
    <iframe id="stream-frame" src="${esc(embedOrUrl)}" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
    <div class="player-fallback" id="stream-fallback" style="display:none">
      <h4>Server embed gagal</h4>
      <p>Host <b>${esc(host||'embed')}</b> tidak bisa diakses (DNS/blokir). Coba server lain, buka di tab baru, atau pakai download.</p>
      <div class="fb-btns">
        <a class="primary" href="${esc(embedOrUrl)}" target="_blank" rel="noopener">Buka embed</a>
        <button type="button" id="fb-retry">Coba lagi</button>
      </div>
    </div>`;
  // show fallback after delay if iframe still blank-ish (can't always detect cross-origin)
  clearTimeout(setPlayer._t);
  setPlayer._t = setTimeout(()=>{
    const fb = $('#stream-fallback');
    if(fb) fb.style.display = 'flex';
  }, 6000);
  const retry = () => {
    const fb = $('#stream-fallback');
    if(fb) fb.style.display = 'none';
    const fr = $('#stream-frame');
    if(fr){ fr.src = embedOrUrl; }
    clearTimeout(setPlayer._t);
    setPlayer._t = setTimeout(()=>{ const f=$('#stream-fallback'); if(f) f.style.display='flex'; }, 6000);
  };
  setTimeout(()=>{
    $('#fb-retry')?.addEventListener('click', retry);
  }, 0);
}

async function openEpisode(url, animeTitle){
  showPage('player');
  $('#p-title').textContent=animeTitle||'Loading…';
  $('#p-sub').textContent='Memuat stream…';
  $('#player-box').innerHTML='<div class="loader"><div class="spin"></div></div>';
  $('#servers').innerHTML='';
  $('#downloads').innerHTML='<div class="empty">Memuat…</div>';
  try{
    const d=await api({action:'episode',url});
    if(!d?.status||!d.result){
      $('#player-box').innerHTML=`<div class="empty">${esc(d?.message||'Episode gagal')}</div>`;
      return;
    }
    const r=d.result;
    currentEp=r;
    $('#p-title').textContent=r.title||animeTitle||'Episode';
    $('#p-sub').textContent=(r.anime&&r.anime.title)?r.anime.title:'Samehadaku · tanpa iklan di UI';

    const streams=r.streams||[];
    const primary=r.stream_url||r.embed_url||r.video_embed||(streams[0]&&(streams[0].embed_url||streams[0].url_stream));
    setPlayer(primary);

    if(streams.length){
      $('#servers').innerHTML=streams.map((s,i)=>
        `<button type="button" class="srv ${i===0?'on':''}" data-i="${i}">${esc(s.server||('Server '+(i+1)))}</button>`
      ).join('');
      $('#servers').querySelectorAll('.srv').forEach(btn=>{
        btn.onclick=()=>{
          $('#servers').querySelectorAll('.srv').forEach(x=>x.classList.remove('on'));
          btn.classList.add('on');
          const s=streams[+btn.dataset.i];
          setPlayer(s.embed_url||s.url_stream);
        };
      });
    } else {
      $('#servers').innerHTML='<span class="chip">Default stream</span>';
    }

    const dls=r.download||[];
    if(Array.isArray(dls)&&dls.length){
      $('#downloads').innerHTML=dls.map(x=>{
        const link=x.url||x.href||x.link||'';
        const label=x.label||x.quality||x.server||x.name||'Download';
        const size=x.size||'';
        if(!link) return '';
        return `<a class="dl-item" href="${esc(link)}" target="_blank" rel="noopener"><div>${esc(label)}</div><span>${esc(size||'Buka')} ↘</span></a>`;
      }).join('')||'<div class="empty">Tidak ada link download</div>';
    } else {
      $('#downloads').innerHTML='<div class="empty">Tidak ada link download untuk episode ini</div>';
    }
    // external stream shortcut
    const ext = r.stream_url||r.embed_url||r.video_embed;
    if(ext){
      const row = document.createElement('div');
      row.className = 'server-row';
      row.style.marginTop = '4px';
      row.innerHTML = `<a class="srv" href="${esc(ext)}" target="_blank" rel="noopener" style="text-decoration:none">↗ Buka stream di tab baru</a>`;
      $('#servers').parentNode?.insertBefore(row, $('#servers').nextSibling);
    }

    // episode list from current anime if available
    const eps=(currentAnime&&currentAnime.episodes)||[];
    if(eps.length){
      $('#p-eps').innerHTML=eps.slice().reverse().slice(0,40).map(e=>{
        const eu=e.url||e.href;
        return `<div class="ep-item ${eu===url?'on':''}" data-url="${esc(eu)}">
          <div class="ep-num">${esc(e.episode||'?')}</div>
          <div class="ep-body"><h4>${esc(e.title||('Ep '+e.episode))}</h4></div>
        </div>`;
      }).join('');
      $('#p-eps').querySelectorAll('.ep-item').forEach(el=>{
        el.onclick=()=>openEpisode(el.dataset.url, currentAnime?.title);
      });
    } else $('#p-eps').innerHTML='';
  }catch{
    $('#player-box').innerHTML='<div class="empty">Gagal memuat episode</div>';
  }
}

$$('.tab').forEach(t=>{
  t.onclick=()=>{
    showPage(t.dataset.page);
    if(t.dataset.page==='home' && !$('#home-grid').querySelector('.card')) loadHome();
  };
});

};

  $('#intro').classList.add('hide');
  $('#app').classList.add('show');

  loadHome();
},2400);
</script>
